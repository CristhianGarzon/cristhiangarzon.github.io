<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Title, description, social cards, canonical/hreflang links and JSON-LD structured data
         are generated from src/data.ts at build time by seo/plugin.ts. -->
    <!--seo:head-->
    <!-- Icons: .ico for Safari and older browsers, SVG for modern ones, PNGs for iOS / Android. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Page background before the styled-components GlobalStyle loads (avoids a white flash). */
      html { background: #0b0d10; }
      html[data-theme='light'] { background: #eef2f6; }
      /* The pre-rendered content inside #root is for crawlers and no-JS visitors; hide it while the app boots. */
      html.js [data-prerendered] { visibility: hidden; }
      [data-prerendered] { max-width: 760px; margin: 0 auto; padding: 32px 16px; color: #eef1f5; font: 16px/1.6 system-ui, sans-serif; }
      html[data-theme='light'] [data-prerendered] { color: #11161d; }
      [data-prerendered] a { color: #3b8eea; }
      [data-prerendered] img { width: 220px; height: auto; border-radius: 16px; }
      [data-prerendered] h1 { line-height: 1.15; }
    </style>
    <script>
      // Apply saved / system theme and language before first paint to avoid a flash.
      (function () {
        var root = document.documentElement;
        root.classList.add('js');
        // If the app fails to start, show the pre-rendered content instead of a blank page.
        setTimeout(function () {
          if (document.querySelector('[data-prerendered]')) root.classList.remove('js');
        }, 4000);

        var t = null;
        try { t = localStorage.getItem('theme'); } catch (e) {}
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        root.dataset.theme = t;

        // Language: ?lang= in the address wins, then the saved choice, then the browser language.
        var l = null;
        try { l = new URLSearchParams(location.search).get('lang'); } catch (e) {}
        if (l !== 'en' && l !== 'es') {
          try { l = localStorage.getItem('lang'); } catch (e) {}
        }
        if (l !== 'en' && l !== 'es') {
          l = (navigator.language || '').toLowerCase().indexOf('es') === 0 ? 'es' : 'en';
        }
        root.lang = l;
      })();
    </script>
  </head>
  <body>
    <div id="root"><!--seo:body--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
